<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tawuniya Showroom VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --brand:#6B47F5; --brand-dark:#34295E; --teal:#3FB8C9; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0E0C14; color:#fff; font-family:Tajawal, system-ui, sans-serif;
               -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas#view { display:block; width:100%; height:100%; touch-action:none; }
  button, a.tbtn { font-family:Tajawal, system-ui, sans-serif; cursor:pointer; }
  /* Top bar */
  #top { position:fixed; top:20px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; gap:12px; }
  #top .chip { pointer-events:auto; background:rgba(52,41,94,.9); border-radius:18px; padding:14px 22px; font-weight:800; font-size:24px; }
  #top .btns { display:flex; gap:12px; pointer-events:auto; }
  .tbtn { font-weight:800; font-size:24px; color:#fff; background:rgba(52,41,94,.9); border:2px solid rgba(255,255,255,.25); border-radius:18px; padding:16px 26px; min-height:68px; box-sizing:border-box; text-decoration:none; display:inline-flex; align-items:center; }
  .tbtn.vr { background:var(--brand); border-color:transparent; }
  .tbtn:hover { filter:brightness(1.2); }
  /* Talk prompt */
  #prompt { position:fixed; bottom:150px; left:50%; transform:translateX(-50%); display:none; }
  #prompt button { font-weight:800; font-size:30px; color:#fff; background:var(--brand); border:3px solid rgba(255,255,255,.35); border-radius:24px; padding:22px 40px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  #prompt button:hover { filter:brightness(1.15); }
  /* Dialogue card */
  #dialog { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); width:min(980px, calc(100% - 40px)); display:none; max-height:calc(100% - 140px); overflow:auto;
            background:rgba(22,18,34,.95); border:2px solid rgba(255,255,255,.14); border-radius:28px; padding:26px; box-sizing:border-box; box-shadow:0 18px 50px rgba(0,0,0,.5); }
  #dialog .who { display:flex; align-items:center; gap:18px; margin-bottom:14px; padding-inline-end:150px; }
  #dialog .who img { width:84px; height:84px; border-radius:50%; border:3px solid var(--brand); background:#fff; object-fit:cover; }
  #dialog .who b { font-size:30px; }
  #dialog .who small { display:block; opacity:.75; font-size:21px; }
  #speaking { margin-inline-start:auto; display:flex; gap:5px; align-items:flex-end; height:30px; }
  #speaking i { width:7px; background:var(--teal); border-radius:3px; height:6px; transition:height .1s; }
  #line { font-size:30px; line-height:1.65; min-height:100px; }
  #you { font-size:23px; color:#C8BEFF; margin-bottom:8px; display:none; }
  #options { display:flex; flex-direction:column; gap:14px; margin-top:18px; }
  #options button { font-weight:700; font-size:27px; line-height:1.4; text-align:start; color:#fff; background:rgba(107,71,245,.22);
                    border:3px solid rgba(107,71,245,.75); border-radius:20px; padding:22px 26px; min-height:88px; }
  #options button:hover, #options button:focus-visible { background:rgba(107,71,245,.6); border-color:#fff; }
  #options .muted { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.25); }
  #closeTalk { position:absolute; top:18px; left:18px; font-weight:800; font-size:22px; color:#fff; background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.25); border-radius:16px; padding:12px 20px; }
  #steps { display:flex; gap:8px; margin-top:18px; }
  #steps i { flex:1; height:7px; border-radius:4px; background:rgba(255,255,255,.15); }
  #steps i.on { background:var(--brand); }
  /* Go-to + walk pad (browser mode: the Quest has no keyboard) */
  #nav { position:fixed; bottom:24px; left:24px; right:24px; display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none; }
  #nav > div { display:flex; gap:12px; pointer-events:auto; }
  .nbtn { font-weight:800; font-size:24px; color:#fff; background:rgba(52,41,94,.92); border:2px solid rgba(255,255,255,.25); border-radius:20px; padding:18px 24px; min-width:96px; min-height:84px; }
  .nbtn:hover { background:rgba(107,71,245,.75); }
  .nbtn.go { background:rgba(63,184,201,.9); color:#0d1b2a; }
  #pad { direction:ltr; display:grid !important; grid-template-columns:repeat(3, 96px); grid-template-rows:repeat(2, 84px); gap:10px !important; }
  #pad .nbtn { padding:0; font-size:36px; }
  body.talking #nav { display:none; }
  /* Start card */
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(14,12,20,.88); z-index:5; }
  #start .card { background:#fff; color:var(--brand-dark); border-radius:32px; padding:44px 48px; max-width:720px; width:calc(100% - 40px); box-sizing:border-box; text-align:center; }
  #start img { width:340px; max-width:80%; }
  #start h1 { font-size:36px; margin:20px 0 10px; }
  #start p { margin:8px 0; color:#555; font-size:24px; line-height:1.5; }
  #start .row { display:flex; gap:16px; justify-content:center; margin-top:26px; flex-wrap:wrap; }
  #start button { font-weight:800; font-size:30px; border:0; border-radius:22px; padding:24px 40px; min-width:260px; }
  #go { background:var(--brand-dark); color:#fff; }
  #goVR { background:var(--brand); color:#fff; }
  #start button:disabled { opacity:.45; }
  #status { font-size:20px; color:#888; margin-top:14px; direction:ltr; }
  @media (max-width:700px) {
    #top .chip { font-size:18px; padding:10px 14px; } .tbtn { font-size:18px; padding:10px 14px; min-height:52px; }
    #pad { grid-template-columns:repeat(3, 70px); grid-template-rows:repeat(2, 64px); } .nbtn { min-height:64px; min-width:70px; font-size:18px; padding:10px 14px; }
    #start .card { padding:28px 20px; } #start h1 { font-size:26px; } #start p { font-size:18px; } #start button { font-size:22px; min-width:200px; padding:18px 24px; }
    #line { font-size:22px; } #options button { font-size:20px; padding:14px 18px; min-height:64px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="top">
  <div class="chip" id="where">معرض السيارات · Car showroom</div>
  <div class="btns">
    <a class="tbtn" href="../">🏠 الرئيسية</a>
    <a class="tbtn" href="../reception/" data-portal="0" style="text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box">🏥 الاستقبال</a>
    <a class="tbtn" href="../accident/" data-portal="1" style="text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box">🚗 موقع الحادث</a>
    <a class="tbtn" href="../home/" data-portal="2" style="text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box">👴 البيت</a>
    <button class="tbtn" id="lang">English</button>
    <button class="tbtn vr" id="vrTop">ادخل VR 🥽</button>
  </div>
</div>
<div id="prompt"><button id="talk"><span id="talkLabel"></span></button></div>
<div id="dialog">
  <button id="closeTalk">✕ إنهاء</button>
  <div class="who">
    <img id="avatar" src="" alt="">
    <div><b id="docname"></b><small id="docrole"></small></div>
    <div id="speaking"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="you"></div>
  <div id="line"></div>
  <div id="options"></div>
  <div id="steps"><i></i><i></i><i></i></div>
</div>
<div id="nav">
  <div>
    <button class="nbtn go" data-goto="advisor">🚘 روح لسلطان</button>
  </div>
  <div id="pad">
    <button class="nbtn" data-hold="turnL">⟲</button><button class="nbtn" data-hold="fwd">▲</button><button class="nbtn" data-hold="turnR">⟳</button>
    <span></span><button class="nbtn" data-hold="back">▼</button><span></span>
  </div>
</div>
<div id="start"><div class="card">
  <img src="assets/branding/tawuniya_logo.png" alt="Tawuniya">
  <h1>معرض السيارات · تأمين المركبات</h1>
  <p>تجوّل بين السيارات، وكلّم سلطان مستشار تأمين المركبات عن الشامل وضد الغير والتعاونية درايف.</p>
  <p style="font-size:20px">في VR: امشي بالـ KAT أو العصا الشمال · وجّه الليزر واضغط الـ Trigger للاختيار · A للتحدث</p>
  <div class="row">
    <button id="goVR" disabled>ادخل VR 🥽</button>
    <button id="go" disabled>ابدأ في المتصفح</button>
  </div>
  <div id="status">Loading…</div>
</div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { addPortal, arrival } from '../portal.js';

// Car showroom in metres: x right, y up, z towards the entrance.
// Same layout as the Unreal map (Scripts/ue_build_showroom.py): room x[-11,11] z[-9,11], four turning platforms.
const CHARACTERS = [
  { key: 'advisor', model: 'assets/models/advisor.glb', height: 1.78,
    pos: [1.6, 6.8], dialog: 'assets/data/motor_advisor_dialog.json', audio: 'media/showroom', ext: 'm4a', avatar: 'media/showroom/advisor_avatar.png',
    name: { ar: 'سلطان', en: 'Sultan' }, role: { ar: 'مستشار تأمين المركبات · التعاونية', en: 'Motor insurance advisor · Tawuniya' },
    prompt: { ar: 'تحدّث مع مستشار التأمين', en: 'Talk to the insurance advisor' }, baseYaw: -15 * Math.PI / 180, maxTurn: 1.2 },
];
const CARS = [   // Models/purchased/cars.json, shrunk for the web
  { file: 'mercedes_gls580', name: 'Mercedes-Benz GLS 580', len: 5.21, pos: [-5.6, -4.2] },
  { file: 'dodge_challenger', name: 'Dodge Challenger', len: 5.02, pos: [5.6, -4.2] },
  { file: 'mercedes_amg_c63', name: 'Mercedes-AMG C63', len: 4.75, pos: [-5.6, 3.6] },
  { file: 'mclaren_senna', name: 'McLaren Senna', len: 4.74, pos: [5.6, 3.6] },
];
for (const c of CHARACTERS) c.data = await (await fetch(c.dialog)).json();
await Promise.all([document.fonts.load('700 64px Tajawal'), document.fonts.load('400 64px Tajawal'), document.fonts.load('800 64px Tajawal')]).catch(() => {});

// ---------------------------------------------------------------- renderer ---
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.9;   // car paint needs reflections
scene.background = new THREE.Color('#1b1726');
scene.add(new THREE.HemisphereLight('#ffffff', '#3a3644', 0.55));

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 700);
const player = new THREE.Group();
player.add(camera);
scene.add(player);
camera.position.y = 1.65;
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- materials ---
const texLoader = new THREE.TextureLoader();
function tex(name, repeat, srgb = true) {
  const t = texLoader.load(`assets/textures/${name}.jpg`);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const std = (color, roughness = 0.8, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, ...extra });
const M = {
  floor: std('#5a5566', 0.12, { map: tex('marble', [8, 7]) }),
  aisle: std('#16131f', 0.25),
  wall: std('#cfcdd8', 0.85),
  brand: std('#ffffff', 0.95, { map: tex('fabric', [6, 2]), normalMap: tex('fabric_normal', [6, 2], false), color: '#5b4a8a' }),
  ceiling: std('#f4f4f6', 0.9),
  strip: std('#ffffff', 0.5, { emissive: '#ffffff', emissiveIntensity: 1.5 }),
  platform: std('#e9e7f0', 0.15, { metalness: 0.3 }),
  ring: std('#6B47F5', 0.3, { emissive: '#6B47F5', emissiveIntensity: 1.2 }),
  plate: std('#120c2a', 0.3),
};

// ------------------------------------------------------------------ helpers ---
const colliders = [];   // axis-aligned boxes in XZ
function box(w, h, d, mat, x, y, z, collide = true, cast = false) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.receiveShadow = true;
  m.castShadow = cast;
  scene.add(m);
  if (collide && y - h / 2 < 1.7 && y + h / 2 > 0.3) colliders.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2 });
  return m;
}
function plane(w, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m);
  return m;
}
function canvasPlane(w, h, draw, px = 1024) {
  const cnv = document.createElement('canvas');
  cnv.width = px; cnv.height = Math.round(px * h / w);
  draw(cnv.getContext('2d'), cnv.width, cnv.height);
  const t = new THREE.CanvasTexture(cnv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, transparent: true, toneMapped: false }));
  return mesh;
}
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const logoImg = await loadImg('assets/branding/tawuniya_logo_white.png');

// ------------------------------------------------------------------- layout ---
const RH = 6.0, RW = 22.0, Z0 = -9.0, Z1 = 11.0, RD = Z1 - Z0, ZC = (Z0 + Z1) / 2;
plane(RW, RD, M.floor, 0, 0, ZC);
plane(3.2, RD, M.aisle, 0, 0.006, ZC);
box(RW, RH, 0.2, M.brand, 0, RH / 2, Z0);
box(0.2, RH, RD, M.wall, -RW / 2, RH / 2, ZC); box(0.2, RH, RD, M.wall, RW / 2, RH / 2, ZC);
box(RW, RH, 0.2, M.wall, 0, RH / 2, Z1);
{ const c = plane(RW, RD, M.ceiling, 0, RH, ZC); c.rotation.x = Math.PI / 2; }
for (const x of [-5.6, 0, 5.6]) box(0.25, 0.04, RD - 2, M.strip, x, RH - 0.03, ZC, false);

// Logo + title on the brand wall
{
  const logo = canvasPlane(6.0, 6.0 * 88 / 295, (c, w, h) => { c.clearRect(0, 0, w, h); c.drawImage(logoImg, 0, 0, w, h); }, 2048);
  logo.position.set(0, 3.6, Z0 + 0.12); scene.add(logo);
  const title = canvasPlane(5.0, 0.7, (c, w, h) => {
    c.clearRect(0, 0, w, h); c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '800 110px Tajawal';
    c.fillText('TAWUNIYA MOTOR · تأمين المركبات', w / 2, h * 0.72);
  }, 2048);
  title.position.set(0, 2.1, Z0 + 0.12); scene.add(title);
}

// Platforms with a glowing rim and a name plate on the aisle side
const turntables = [];
CARS.forEach((car, i) => {
  const [x, z] = car.pos;
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(3.35, 3.35, 0.06, 64), M.ring); ring.position.set(x, 0.03, z); scene.add(ring);
  const plat = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.2, 64), M.platform); plat.position.set(x, 0.1, z); plat.receiveShadow = true; scene.add(plat);
  colliders.push({ x0: x - 2.9, x1: x + 2.9, z0: z - 2.9, z1: z + 2.9 });
  const spin = new THREE.Group(); spin.position.set(x, 0.2, z); spin.rotation.y = (35 + 90 * i) * Math.PI / 180; scene.add(spin);
  turntables.push(spin); car.spin = spin;
  const sx = x > 0 ? x - 3.4 : x + 3.4;
  box(0.06, 0.5, 1.9, M.plate, sx, 0.45, z + 1.2, false);
  const name = canvasPlane(1.85, 0.45, (c, w, h) => {
    c.clearRect(0, 0, w, h); c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '700 64px Tajawal';
    c.fillText(car.name, w / 2, h * 0.62);
  }, 1024);
  name.position.set(sx + (x < 0 ? 0.035 : -0.035), 0.45, z + 1.2); name.rotation.y = x < 0 ? Math.PI / 2 : -Math.PI / 2; scene.add(name);
  const spot = new THREE.PointLight('#ffffff', 18, 9, 2); spot.position.set(x, RH - 0.6, z); scene.add(spot);
});

// Lights: soft key light with shadows, plus fill along the aisle
const sun = new THREE.DirectionalLight('#ffffff', 1.4);
sun.position.set(-6, 14, 8); sun.castShadow = true;
sun.target.position.set(0, 0, 0); scene.add(sun.target);
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
sun.shadow.bias = -0.0005; sun.shadow.radius = 3;
scene.add(sun);
for (const z of [-2, 6]) { const p = new THREE.PointLight('#fff8ee', 10, 16, 2); p.position.set(0, RH - 0.5, z); scene.add(p); }

// ------------------------------------------------------------------ models ---
const gltf = new GLTFLoader();
function fit(root, { len, height }) {
  const g = new THREE.Group(); g.add(root);
  g.updateMatrixWorld(true);
  let b = new THREE.Box3().setFromObject(g); const s = b.getSize(new THREE.Vector3());
  g.scale.setScalar(height ? height / s.y : len / Math.max(s.x, s.z));
  g.updateMatrixWorld(true);
  b = new THREE.Box3().setFromObject(g); const c = b.getCenter(new THREE.Vector3());
  root.position.sub(new THREE.Vector3(c.x / g.scale.x, b.min.y / g.scale.x, c.z / g.scale.x));
  return g;
}
const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
gltf.setDRACOLoader(draco);
// Car on its turntable: long axis along x, scaled to its real length
async function car(c) {
  const res = await gltf.loadAsync(`assets/models/${c.file}.glb`);
  res.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const b = new THREE.Box3().setFromObject(res.scene), s = b.getSize(new THREE.Vector3());
  const inner = new THREE.Group(); inner.add(res.scene);
  inner.rotation.y = s.z > s.x ? Math.PI / 2 : 0;
  c.spin.add(fit(inner, { len: c.len }));
}
async function plant(x, z, h) {
  const res = await gltf.loadAsync('assets/models/plant.glb');
  res.scene.traverse(o => { if (o.isMesh) o.castShadow = true; });
  const holder = new THREE.Group(); holder.add(fit(res.scene, { height: h }));
  holder.position.set(x, 0, z); scene.add(holder);
  colliders.push({ x0: x - 0.35, x1: x + 0.35, z0: z - 0.35, z1: z + 0.35 });
}
// People (Meshy characters face +z already)
async function loadCharacter(c) {
  const res = await gltf.loadAsync(c.model);
  res.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  c.group = new THREE.Group();
  c.group.add(fit(res.scene, { height: c.height }));
  c.group.position.set(c.pos[0], 0, c.pos[1]);
  c.group.rotation.y = c.baseYaw || 0;
  scene.add(c.group);
  colliders.push({ x0: c.pos[0] - 0.3, x1: c.pos[0] + 0.3, z0: c.pos[1] - 0.25, z1: c.pos[1] + 0.25 });
}

// ------------------------------------------------------------------- input ---
let yaw = 0, pitch = -0.05, aHeld = false;
player.position.set(0, 0, 9.5);
const keys = new Set();
addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyE' && nearest && !talking) startDialog(nearest);
  if (e.code === 'KeyL') setLang(LANG === 'ar' ? 'en' : 'ar');
});
addEventListener('keyup', e => keys.delete(e.code));
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging || talking) return;
  yaw -= (e.clientX - lx) * 0.004; pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - ly) * 0.004));
  lx = e.clientX; ly = e.clientY;
});
function collide(x, z) {
  const R = 0.28;
  x = Math.max(-10.6, Math.min(10.6, x)); z = Math.max(-8.6, Math.min(10.6, z));   // inside the showroom walls
  for (let k = 0; k < 2; k++) for (const b of colliders) {

    const g = talking.group.position;
    const want = Math.atan2(-(g.x - player.position.x), -(g.z - player.position.z));
    let diff = want - yaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    yaw += diff * Math.min(1, dt * 2.5);
    const dist = Math.hypot(g.x - player.position.x, g.z - player.position.z);
    pitch += (Math.atan2(talking.height - 0.15 - 1.65, dist) - pitch) * Math.min(1, dt * 2.5);
  }
  if (analyser) { analyser.getByteFrequencyData(freq); bars.forEach((b, i) => { b.style.height = `${4 + freq[i * 3] / 255 * 14}px`; }); }
  else bars.forEach(b => { b.style.height = '4px'; });

  for (const tt of turntables) tt.rotation.y += dt * 0.15;
  vr.update(inXR, t);
  camera.getWorldPosition(tmp); for (const p of portals) p.update(t, tmp.x, tmp.z);
  if (inXR) updateLasers();
  renderer.render(scene, camera);
});
</script>
